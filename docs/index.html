<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rewire｜神經可塑性的學習與練習</title>
    <meta name="description" content="理解神經可塑性，練習覺察思考、情緒與行為。以《Rewire》為參考、內容為原創重新組織的繁體中文互動式學習與練習網站（非官方，不具醫療或心理諮商功能）。" />
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B201D" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- 在 React 載入前先套用主題、字級與動畫設定，避免畫面閃爍 -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('rewire:v1') || '{}').settings || {};
          var dark = s.theme === 'dark' || (s.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.font = s.fontScale || 'md';
          if (s.motion === 'reduce') document.documentElement.dataset.motion = 'reduce';
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DmGizRCe.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/react-DoicN1r0.js">
