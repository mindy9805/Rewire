# 自動檢查（不部署）：程式碼檢查、型別檢查、單元測試與建置
# 網站由 GitHub Pages 直接提供 docs/ 資料夾（Settings → Pages → Deploy from a branch → main → /docs）。
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 程式碼檢查、型別檢查、單元測試
        run: npm run lint && npm run typecheck && npm test
      - name: 建置並確認 docs/ 已更新
        run: |
          npm run build
          git diff --stat --exit-code -- docs || (echo "::warning::docs/ 與原始碼不一致，請在本機執行 npm run build 後一併提交 docs/" && exit 1)
